name: PREVIEW_PUBLISH
jobs:
  preview-context:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pr_id: ${{ steps.pr.outputs.id }}
      tdesign_vue_next_domain: ${{ steps.tdesign-vue-next-domain.outputs.tdesign_vue_next_domain }}
      tdesign_vue_next_chat_domain: ${{ steps.tdesign-vue-next-chat-domain.outputs.tdesign_vue_next_chat_domain }}
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG preview-context: observing triggering PREVIEW_BUILD run"
        RUN_ID="${{ toJSON(github.event.workflow_run.id) }}"
        printf 'GERALT_DBG run_id=%s\n' "${RUN_ID:-<unset>}"
        CONCLUSION="${{ toJSON(github.event.workflow_run.conclusion) }}"
        printf 'GERALT_DBG conclusion=%s\n' "${CONCLUSION:-<unset>}"
        HEAD_REPO="${{ toJSON(github.event.workflow_run.head_repository.full_name) }}"
        printf 'GERALT_DBG head_repository=%s\n' "${HEAD_REPO:-<unset>}"
        EVENT="${{ toJSON(github.event.workflow_run.event) }}"
        printf 'GERALT_DBG triggering_event=%s\n' "${EVENT:-<unset>}"
      continue-on-error: true
    - name: Download pr id
      uses: dawidd6/action-download-artifact@v8
      with:
        workflow: ${{ github.event.workflow_run.workflow_id }}
        run_id: ${{ github.event.workflow_run.id }}
        name: pr-id
    - name: Set pr id
      id: pr
      run: echo "id=$(cat pr-id.txt)" >> $GITHUB_OUTPUT
    - name: tdesign-vue-next-domain
      id: tdesign-vue-next-domain
      run: echo "tdesign_vue_next_domain=https://preview-pr-${{ steps.pr.outputs.id }}-tdesign-vue-next.surge.sh" >> $GITHUB_OUTPUT
    - name: tdesign-vue-next-chat-domain
      id: tdesign-vue-next-chat-domain
      run: echo "tdesign_vue_next_chat_domain=https://preview-pr-${{ steps.pr.outputs.id }}-tdesign-vue-next-chat.surge.sh" >> $GITHUB_OUTPUT
  tdesign-vue-next:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: preview-context
    steps:
    - uses: dawidd6/action-download-artifact@v8
      with:
        workflow: ${{ github.event.workflow_run.workflow_id }}
        run_id: ${{ github.event.workflow_run.id }}
        name: tdesign-vue-next-site
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sink tdesign-vue-next: workspace and domain inspection"
        ls -la ./ 2>/dev/null | head -50 || true
        if [ -d ./node_modules/.bin ]; then
          printf 'GERALT_DBG ./node_modules/.bin present:\n'
          ls -la ./node_modules/.bin 2>/dev/null | head -50 || true
        else
          printf 'GERALT_DBG no ./node_modules/.bin\n'
        fi
        if [ -e ./node_modules/.bin/surge ]; then
          printf 'GERALT_DBG local surge candidate found at ./node_modules/.bin/surge\n'
        fi
        DOMAIN="${{ needs.preview-context.outputs.tdesign_vue_next_domain }}"
        printf 'GERALT_DBG deploy_domain=%s\n' "${DOMAIN:-<unset>}"
      continue-on-error: true
    - run: "export DEPLOY_DOMAIN=${{ needs.preview-context.outputs.tdesign_vue_next_domain }}\nnpx surge --project ./ --domain $DEPLOY_DOMAIN --token ${{ secrets.TDESIGN_SURGE_TOKEN }}  \n"
  tdesign-vue-next-chat:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: preview-context
    steps:
    - uses: dawidd6/action-download-artifact@v8
      with:
        workflow: ${{ github.event.workflow_run.workflow_id }}
        run_id: ${{ github.event.workflow_run.id }}
        name: tdesign-vue-next-chat-site
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG sink tdesign-vue-next-chat: workspace and domain inspection"
        ls -la ./ 2>/dev/null | head -50 || true
        if [ -d ./node_modules/.bin ]; then
          printf 'GERALT_DBG ./node_modules/.bin present:\n'
          ls -la ./node_modules/.bin 2>/dev/null | head -50 || true
        else
          printf 'GERALT_DBG no ./node_modules/.bin\n'
        fi
        if [ -e ./node_modules/.bin/surge ]; then
          printf 'GERALT_DBG local surge candidate found at ./node_modules/.bin/surge\n'
        fi
        DOMAIN="${{ needs.preview-context.outputs.tdesign_vue_next_chat_domain }}"
        printf 'GERALT_DBG deploy_domain=%s\n' "${DOMAIN:-<unset>}"
      continue-on-error: true
    - run: "export DEPLOY_DOMAIN=${{ needs.preview-context.outputs.tdesign_vue_next_chat_domain }}\nnpx surge --project ./ --domain $DEPLOY_DOMAIN --token ${{ secrets.TDESIGN_SURGE_TOKEN }}           \n"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - PREVIEW_BUILD
    types:
    - completed
